name: dhow web (apps/dhow)

# apps/dhow shipped with no CI at all: 457 tracked TS/TSX files, zero tests,
# nothing that could fail a bad merge. This is the gate that has to exist before
# the AI SDK v4 -> v7 migration touches the agent runtime, because that change
# rewrites code no test covers.
#
# Path-filtered so desktop-only work does not pay for it. Deliberately scoped to
# typecheck + lint: `next build` additionally wants Auth0 env and a reachable
# MongoDB, and a permanently red job nobody can fix is worse than no job.

on:
  pull_request:
    paths:
      - 'apps/dhow/**'
      - '.github/workflows/dhow-web.yml'
  push:
    branches: [main]
    paths:
      - 'apps/dhow/**'
      - '.github/workflows/dhow-web.yml'
  workflow_dispatch:

jobs:
  verify:
    name: apps/dhow typecheck + lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dhow
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/dhow/package-lock.json

      # `npm ci` fails loudly if package.json and the lockfile drift apart,
      # which also guards the vendored-dependency work: nothing here may
      # reintroduce an install-time dependency on a third-party GitHub org.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Characterization tests pinning current behaviour of the agent runtime,
      # which the port into apps/dhowx moves wholesale. CI is intentionally the
      # place these run unattended: vitest refuses to CREATE snapshots when
      # CI=true, so a missing snapshot fails here instead of being silently
      # written and passing.
      - name: Test
        run: npm test
